spring.application.name=AuthService
server.port=8001

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/no23_sports_user
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
# Honor X-Forwarded-Prefix from the gateway so springdoc's redirects
# and generated OpenAPI server URL account for the gateway's path prefix
server.forward-headers-strategy=framework

# springdoc's redirect from swagger-ui.html doesn't reliably honor
# X-Forwarded-Prefix even with forward-headers-strategy=framework - it's a
# known open bug (springdoc/springdoc-openapi#2708, #397, #3081). Instead,
# explicitly bake the gateway's path prefix into springdoc's own config, the
# same way this service's own @RequestMapping already expects the prefix.
# The gateway forwards these paths unmodified (no StripPrefix), so they must
# match exactly what springdoc serves here.
springdoc.swagger-ui.path=/auth/swagger-ui.html
springdoc.api-docs.path=/auth/v3/api-docs
springdoc.webjars.prefix=/auth/webjars
spring.mvc.webjars-path-pattern=/auth/webjars/**

springdoc.swagger-ui.config-url=/auth/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/auth/v3/api-docs

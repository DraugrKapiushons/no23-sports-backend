spring.application.name=PaymentService
server.port=8007

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/no23_payment
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}

# Iyzico sandbox: https://sandbox-api.iyzipay.com - production: https://api.iyzipay.com
iyzico.api-key=${IYZICO_API_KEY}
iyzico.secret-key=${IYZICO_SECRET_KEY}
iyzico.base-url=${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
# Where Iyzico POSTs the checkout-form result back to. Must be reachable
# from the internet (i.e. the public gateway URL), not localhost, once past
# local development.
iyzico.callback-url=${IYZICO_CALLBACK_URL:http://localhost:8080/payments/callback}

# Frontend pages the member is redirected to after /payments/callback
# finishes processing the result.
frontend.payment-success-url=${FRONTEND_PAYMENT_SUCCESS_URL:http://localhost:3000/payment/success}
frontend.payment-failure-url=${FRONTEND_PAYMENT_FAILURE_URL:http://localhost:3000/payment/failure}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Honor X-Forwarded-Prefix from the gateway so springdoc's redirects
# and generated OpenAPI server URL account for the gateway's path prefix
server.forward-headers-strategy=framework

springdoc.swagger-ui.path=/payments/swagger-ui.html
springdoc.api-docs.path=/payments/v3/api-docs
springdoc.webjars.prefix=/payments/webjars
spring.mvc.webjars-path-pattern=/payments/webjars/**

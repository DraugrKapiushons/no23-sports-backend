spring.application.name=BlogService
server.port=8011

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/no23_blog
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Honor X-Forwarded-Prefix from the gateway so springdoc's redirects
# and generated OpenAPI server URL account for the gateway's path prefix
server.forward-headers-strategy=framework

springdoc.swagger-ui.path=/blog/swagger-ui.html
springdoc.api-docs.path=/blog/v3/api-docs
springdoc.webjars.prefix=/blog/webjars
spring.mvc.webjars-path-pattern=/blog/webjars/**

spring.application.name=MealPlanService
server.port=8004

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/no23_mealplan
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Logical Eureka application name of the menu-service instance(s) this
# service calls over REST to fetch menu items when generating a plan.
menu-service.name=MENU-SERVICE

# Honor X-Forwarded-Prefix from the gateway so springdoc's redirects
# and generated OpenAPI server URL account for the gateway's path prefix
server.forward-headers-strategy=framework

# springdoc's redirect from swagger-ui.html doesn't reliably honor
# X-Forwarded-Prefix even with forward-headers-strategy=framework - it's a
# known open bug (springdoc/springdoc-openapi#2708, #397, #3081). Instead,
# explicitly bake the gateway's path prefix into springdoc's own config, the
# same way this service's own @RequestMapping already expects the prefix.
# The gateway forwards these paths unmodified (no StripPrefix), so they must
# match exactly what springdoc serves here.
springdoc.swagger-ui.path=/kitchen/meal-plans/swagger-ui.html
springdoc.api-docs.path=/kitchen/meal-plans/v3/api-docs
springdoc.webjars.prefix=/kitchen/meal-plans/webjars
spring.mvc.webjars-path-pattern=/kitchen/meal-plans/webjars/**

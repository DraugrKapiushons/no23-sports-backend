spring.application.name=ApiGateway
server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# lb:// resolves against Eureka (via spring-cloud-loadbalancer, pulled in
# transitively by spring-cloud-starter-gateway) and spreads requests across
# every registered instance of that service - no hardcoded host:port anywhere.
#
# Swagger/OpenAPI routes are listed first per service, ahead of that
# service's business route, since Gateway matches routes in list order and
# /auth/swagger-ui/** would otherwise never be reached once /auth/** already
# matched. StripPrefix=1 removes the service prefix (e.g. /auth) before
# forwarding, because springdoc serves swagger-ui/v3-api-docs/webjars at
# each service's own root - it doesn't know about the gateway's prefix.

spring.cloud.gateway.server.webflux.routes[0].id=auth-service-docs
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AuthService
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/swagger-ui.html,/auth/swagger-ui/**,/auth/v3/api-docs,/auth/v3/api-docs/**,/auth/webjars/**

spring.cloud.gateway.server.webflux.routes[1].id=auth-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://AuthService
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/auth/**


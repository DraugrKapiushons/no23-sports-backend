# Single place for CORS now that the gateway is the one public entry point.
# ORIGIN defaults to a local dev frontend - override per environment, don't
# ship allowedOrigins=* to production.
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=${ALLOWED_ORIGIN:http://localhost:3000}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true



spring.application.name=CalorieTrackingService
server.port=8014

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/no23_calorie_tracking
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Logical Eureka application names of the service instance(s) this service
# calls over REST: menu-service for a menu item's macros when a meal is
# logged "from the menu", user-profile-service for the member's daily
# calorie/macro goal shown alongside what's been logged.
menu-service.name=MENU-SERVICE
user-profile-service.name=USER-PROFILE-SERVICE

# Flat daily water target in ml (see Specs.md section 7's "Su tüketimi").
# There's no per-member water goal field in UserProfileService today, unlike
# calories/macros, so this is a simple default rather than a per-user lookup.
tracking.default-water-goal-ml=2000

# Honor X-Forwarded-Prefix from the gateway so springdoc's redirects
# and generated OpenAPI server URL account for the gateway's path prefix
server.forward-headers-strategy=framework

# springdoc's redirect from swagger-ui.html doesn't reliably honor
# X-Forwarded-Prefix even with forward-headers-strategy=framework - it's a
# known open bug (springdoc/springdoc-openapi#2708, #397, #3081). Instead,
# explicitly bake the gateway's path prefix into springdoc's own config, the
# same way this service's own @RequestMapping already expects the prefix.
# The gateway forwards these paths unmodified (no StripPrefix), so they must
# match exactly what springdoc serves here.
springdoc.swagger-ui.path=/kitchen/tracking/swagger-ui.html
springdoc.api-docs.path=/kitchen/tracking/v3/api-docs
springdoc.webjars.prefix=/kitchen/tracking/webjars
spring.mvc.webjars-path-pattern=/kitchen/tracking/webjars/**
